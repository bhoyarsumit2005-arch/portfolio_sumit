<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6ef" />
    <meta name="robots" content="noindex, follow" />
    <title>Page not found | Sumit Bhoyar</title>
    <meta
      name="description"
      content="That page does not exist. Head back to Sumit Bhoyar's portfolio to see his projects, skills, and contact details."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/manrope-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-italic-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Manrope';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url('/fonts/manrope-normal-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Instrument Serif';
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/instrument-serif-italic-latin.woff2') format('woff2');
      }
      :root {
        --ink: #141414;
        --ink-soft: #33362f;
        --muted: #6b6f66;
        --paper: #f7f6ef;
        --lime: #d9ff4b;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        min-width: 320px;
        display: flex;
        flex-direction: column;
        font-family: 'Manrope', sans-serif;
        color: var(--ink);
        background: var(--paper);
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .header {
        padding: 26px 32px;
      }
      .wordmark {
        font-weight: 800;
        font-size: 22px;
        letter-spacing: -0.5px;
      }
      .wordmark span {
        color: var(--ink);
      }
      .wordmark em {
        font-style: normal;
        background: var(--lime);
        padding: 0 3px;
      }
      main {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 24px 32px 72px;
      }
      .panel {
        width: 100%;
        max-width: 720px;
        min-width: 0;
        text-align: center;
      }
      .eyebrow {
        margin: 0 0 14px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2.4px;
        text-transform: uppercase;
        color: var(--muted);
      }
      .code {
        margin: 0;
        font-size: clamp(88px, 18vw, 180px);
        line-height: 0.86;
        font-weight: 800;
        letter-spacing: -8px;
      }
      .code b {
        font-family: 'Instrument Serif', Georgia, serif;
        font-style: italic;
        font-weight: 400;
        letter-spacing: -2px;
      }
      h1 {
        margin: 18px 0 0;
        font-size: clamp(26px, 4.6vw, 40px);
        line-height: 1.15;
        letter-spacing: -1.2px;
      }
      h1 em {
        font-family: 'Instrument Serif', Georgia, serif;
        font-style: italic;
        font-weight: 400;
      }
      p {
        width: 100%;
        max-width: 480px;
        margin: 16px auto 0;
        font-size: 15.5px;
        line-height: 1.75;
        color: var(--ink-soft);
        overflow-wrap: break-word;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 30px;
      }
      .button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 13px 22px;
        border: 1.6px solid var(--ink);
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1.4px;
        text-transform: uppercase;
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease;
      }
      .button-dark {
        background: var(--ink);
        color: var(--paper);
        box-shadow: 3px 3px 0 var(--lime);
      }
      .button:hover {
        transform: translate(-1px, -1px);
      }
      .button:focus-visible {
        outline: 3px solid var(--lime);
        outline-offset: 3px;
      }
      .footer {
        padding: 22px 32px;
        font-size: 12px;
        color: var(--muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <a class="wordmark" href="/" aria-label="Sumit Bhoyar, back to home">
        <em>SB</em>.
      </a>
    </header>

    <main>
      <div class="panel">
        <p class="eyebrow">Error 404 / Page not found</p>
        <p class="code">4<b>0</b>4</p>
        <h1>This page slipped <em>off the grid.</em></h1>
        <p>
          The link may be broken, or the page moved somewhere else. Everything worth seeing is still on the
          home page.
        </p>
        <div class="actions">
          <a class="button button-dark" href="/">Back to home</a>
          <a class="button" href="/#projects">See projects</a>
        </div>
      </div>
    </main>

    <footer class="footer">© 2026 Sumit Bhoyar · Nagpur, India</footer>
  </body>
</html>
